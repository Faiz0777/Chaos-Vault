<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CHAOS VAULT - TITAN DIRECT CLOUD</title>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <style>
        body { margin:0; background:black; color:#00ffff; font-family:Arial, sans-serif; overflow-x:hidden; }
        #chaos { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; padding:20px; height:100vh; }
        .box { border:1px solid cyan; display:flex; justify-content:center; align-items:center; font-size:11px; cursor:pointer; height: 100px; opacity: 0.5; transition: 0.3s; }
        .box:hover { opacity: 1; background: rgba(0,255,255,0.1); }
        
        #login { position:fixed; inset:0; display:none; background:black; align-items:center; justify-content:center; flex-direction:column; z-index: 2000; }
        #login input { width:260px; padding:12px; margin:10px; background:black; color:cyan; border:1px solid cyan; outline: none; font-family: monospace; }
        
        #vault { display:none; padding:40px; max-width: 800px; margin: auto; }
        .section { border:1px solid cyan; margin:20px 0; padding:20px; background: rgba(0,255,255,0.05); }
        
        textarea { width:100%; background:black; color:cyan; border:1px solid #005555; padding:12px; margin: 10px 0; box-sizing: border-box; font-family: monospace; outline: none; resize: vertical; }
        
        button { background: cyan; color: black; border: none; padding: 12px 24px; cursor: pointer; font-weight: bold; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: white; box-shadow: 0 0 15px cyan; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }

        #status-display { font-family: monospace; font-size: 13px; color: #0ff; margin-top: 15px; padding: 10px; border-left: 3px solid cyan; background: rgba(0,255,255,0.05); display: none; }
        
        #alert { position:fixed; inset:0; display:none; background:black; color:red; z-index:3000; align-items:center; justify-content:center; font-size:32px; text-align:center; animation:blink 0.4s infinite; font-weight: bold; }
        @keyframes blink { 50%{opacity:0.2;} }
        
        #secret-trigger { position:fixed; bottom:0; right:0; width:60px; height:60px; cursor: pointer; z-index: 5000; background: transparent; }
    </style>
</head>
<body>

<div id="chaos"></div>
<div id="alert">ACCESS RESTRICTED<br>UNAUTHORIZED ENTRY</div>

<div id="login">
    <h2 style="letter-spacing: 5px;">SYSTEM LOGIN</h2>
    <input id="p" type="password" placeholder="ENTER PASSCODE">
    <button onclick="login()">INITIALIZE</button>
</div>

<div id="vault">
    <h1 style="color: cyan; border-bottom: 2px solid cyan; padding-bottom: 10px;">🚀 TITAN DIRECT CLOUD</h1>
    
    <div class="section">
        <h3>📂 DIRECT FILE UPLINK</h3>
        <p style="font-size: 11px; color: #088;">Target Account: <strong>codervaultweb@gmail.com</strong></p>
        <input type="file" id="fileInput">
        <br><br>
        <button id="uploadBtn" onclick="initiateAction('upload')">⬆️ STREAM TO DRIVE</button>
        <div id="status-display"></div>
    </div>

    <div class="section">
        <h3>📝 CLOUD FRAGMENTS</h3>
        <textarea id="notes" rows="8" placeholder="Enter notes to sync..."></textarea>
        <button id="saveNotesBtn" onclick="initiateAction('notes')">💾 SYNC TO DRIVE</button>
    </div>
</div>

<div id="secret-trigger"></div>

<script>
const CLIENT_ID = '553428430402-cqsksdvrjslus6bf75na5n07f2cnhv64.apps.googleusercontent.com';
const TARGET_EMAIL = 'codervaultweb@gmail.com';
let tokenClient, accessToken = null;
let currentPendingAction = null;

/* ---------- GOOGLE API SETUP ---------- */
function gapiLoaded() { 
    gapi.load('client', () => gapi.client.init({})); 
}

function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        hint: TARGET_EMAIL,
        callback: (resp) => {
            if (resp.error) {
                updateStatus("AUTH ERROR: " + resp.error, true);
                return;
            }
            accessToken = resp.access_token;
            if (currentPendingAction) currentPendingAction();
        }
    });
}

/* ---------- CORE ACTIONS ---------- */
function initiateAction(type) {
    if (type === 'upload') currentPendingAction = uploadFile;
    if (type === 'notes') currentPendingAction = syncNotes;

    if (!accessToken) {
        tokenClient.requestAccessToken({ prompt: 'select_account' });
    } else {
        currentPendingAction();
    }
}

async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if (!file) return alert("Please select a file.");

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    updateStatus(`STREAMING: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)...`);

    try {
        const metadata = { name: file.name, mimeType: file.type };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
            body: form
        });

        if (response.ok) {
            updateStatus(`✅ SUCCESS: ${file.name} uploaded to Drive.`);
            fileInput.value = ""; // Clear input
        } else {
            const err = await response.json();
            throw new Error(err.error.message);
        }
    } catch (err) {
        updateStatus("❌ UPLOAD FAILED: " + err.message, true);
    } finally {
        btn.disabled = false;
        currentPendingAction = null;
    }
}

async function syncNotes() {
    const content = document.getElementById('notes').value;
    const btn = document.getElementById('saveNotesBtn');
    btn.disabled = true;
    updateStatus("SYNCING NOTES TO DRIVE...");

    try {
        const metadata = { name: 'vault_notes.txt', mimeType: 'text/plain' };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', new Blob([content], { type: 'text/plain' }));

        const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
            body: form
        });

        if (response.ok) {
            updateStatus("✅ NOTES SYNCED SUCCESSFULLY.");
        } else {
            throw new Error("Sync Failed");
        }
    } catch (err) {
        updateStatus("❌ SYNC FAILED: " + err.message, true);
    } finally {
        btn.disabled = false;
        currentPendingAction = null;
    }
}

function updateStatus(msg, isError = false) {
    const display = document.getElementById('status-display');
    display.style.display = "block";
    display.style.color = isError ? "red" : "#0ff";
    display.innerText = "> " + msg;
}

/* ---------- LOGIN & SECRET ENTRANCE ---------- */
function login() {
    if (document.getElementById("p").value === "1111") {
        document.getElementById("login").style.display = "none";
        document.getElementById("vault").style.display = "block";
    } else {
        document.getElementById("alert").style.display = "flex";
        setTimeout(() => document.getElementById("alert").style.display = "none", 2000);
    }
}

let secretClicks = 0;
document.getElementById("secret-trigger").onclick = () => {
    secretClicks++;
    if (secretClicks >= 3) {
        const phrase = prompt("PHRASE:");
        if (phrase === "THE OG IS HERE") {
            document.getElementById("chaos").style.display = "none";
            document.getElementById("login").style.display = "flex";
        }
        secretClicks = 0;
    }
};

/* ---------- CHAOS GRID GENERATION ---------- */
for(let i=0; i<48; i++) {
    const d = document.createElement("div"); 
    d.className = "box"; 
    d.innerText = "DATA-NODE-" + i;
    d.onclick = () => {
        document.getElementById("alert").style.display = "flex";
        setTimeout(() => document.getElementById("alert").style.display = "none", 1500);
    };
    document.getElementById("chaos").appendChild(d);
}
</script>
</body>
</html>
